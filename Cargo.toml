[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Kristian Pilatovich"]
publish = false

[workspace.dependencies]
ognivo-core = { path = "crates/ognivo-core" }
ognivo-models = { path = "crates/ognivo-models" }
ognivo-protocol = { path = "crates/ognivo-protocol" }
ognivo-store = { path = "crates/ognivo-store" }
ognivo-tools = { path = "crates/ognivo-tools" }

anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
globset = "0.4"
ignore = "0.4"
regex = "1.12"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustix = { version = "1.1", features = ["process"] }
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
tempfile = "3.27"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
toml = "1.1.8"
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
