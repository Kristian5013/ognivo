# What scripts/check.sh checks before each commit (formatting, lints, the tests of the
# workspace and of the UI), the UI's build, and the GUI end to end: a session in a real
# window on a real core, against a fake llama-server. On Linux and on Windows, where the
# shell of the agent is Git Bash, as it is for a user there. No GPU and no model here: the
# live evaluations (T2) run where the models are.
name: CI

on:
  # m1 is pushed with main on the same commit: one run is enough
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo.toml's rust-version: the lints the code is written against
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  check:
    name: lints and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/check.sh
      - run: npm run build -w @ognivo/ui

  e2e:
    name: the GUI end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: cargo build --locked -p ognivo-cli
      - run: npm ci
      - run: npm run install-electron -w @ognivo/desktop
      - run: npm run build -w @ognivo/ui
      # Ubuntu 24.04 keeps Chromium's sandbox from unprivileged user namespaces (README)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run e2e -w @ognivo/desktop
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: apps/desktop/test-results
          if-no-files-found: ignore

  check-windows:
    name: lints and tests on Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt -c clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/check.sh

  e2e-windows:
    name: the GUI end to end on Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: cargo build --locked -p ognivo-cli
      - run: npm ci
      - run: npm run install-electron -w @ognivo/desktop
      - run: npm run build -w @ognivo/ui
      - run: npm run e2e -w @ognivo/desktop
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results-windows
          path: apps/desktop/test-results
          if-no-files-found: ignore
