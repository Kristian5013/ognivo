# The packages of a release. Linux's (scripts/package.sh): the .deb, the AppImage and the
# tarball of ognivo, built on Ubuntu 22.04, the oldest system they are for: glibc is what
# ognivo needs of one. Windows' (scripts/package-windows.sh): the installer, the zip of the
# window and the zip of ognivo.exe, built on Windows Server 2025. A tag v<version> pushed
# puts them all, with one SHA256SUMS, into a draft release, to look at and publish by hand;
# run by hand, the workflow keeps each system's packages as its artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install-electron -w @ognivo/desktop
      - name: the tag is the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME is not v$version, Cargo.toml's version (scripts/version.sh)"
            exit 1
          fi
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: |
            out/ognivo_*_amd64.deb
            out/ognivo-*-x86_64.AppImage
            out/ognivo-*-x86_64-linux.tar.gz
          retention-days: 14

  windows:
    name: Windows packages
    runs-on: windows-2025
    defaults:
      run:
        # Git Bash, which the packaging script is written for
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install-electron -w @ognivo/desktop
      - run: scripts/package-windows.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: |
            out/ognivo-*-x86_64-windows-setup.exe
            out/ognivo-*-x86_64-windows.zip
            out/ognivo-*-x86_64-windows-cli.zip
          retention-days: 14

  release:
    name: the draft release
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: one SHA256SUMS
        run: cd packages && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --title "ognivo ${GITHUB_REF_NAME#v}" packages/*
