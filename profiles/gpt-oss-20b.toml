# gpt-oss-20b, Harmony format.
# Sources: docs/research/2026-10-29/gpt-oss.md, docs/m0/measurements.md.
id = "gpt-oss-20b"
family = "harmony"
display_name = "gpt-oss-20b"

[detect]
# With parse_special=true this text must tokenize to exactly this one id.
probe = { text = "<|channel|>", id = 200005 }
name_hints = ["gpt-oss-20b"]

[tokens]
# Must never appear as ids inside content spans (special-token injection guard).
structural = ["<|start|>", "<|end|>", "<|message|>", "<|channel|>", "<|constrain|>", "<|call|>", "<|return|>"]
# All of them frame messages; unbroken inside tool arguments they are a leaked format (§5.3).
framing = ["<|start|>", "<|end|>", "<|message|>", "<|channel|>", "<|constrain|>", "<|call|>", "<|return|>"]
eog = [200002, 200012] # <|return|>, <|call|>
# Every other CONTROL token of the GGUF vocab (gpt-oss-20b-F16.gguf, 2026-10-31), the reserved
# ones included: the guard breaks exactly these strings.
specials = [
    "<|startoftext|>", "<|endoftext|>", "<|endofprompt|>",
    "<|reserved_200000|>", "<|reserved_200001|>", "<|reserved_200004|>", "<|reserved_200009|>",
    "<|reserved_200010|>", "<|reserved_200011|>", "<|reserved_200013|>", "<|reserved_200014|>",
    "<|reserved_200015|>", "<|reserved_200016|>", "<|reserved_200017|>",
]
# Harmony prompts start without BOS.

[sampling.main]
temperature = 1.0
top_p = 1.0
top_k = 0
min_p = 0.0

[reasoning]
control = "effort"              # lives in the system message: fixed for the session
levels = ["low", "medium", "high"]
default = "high"                # SWE-bench Verified 60.7 / 53.2 / 37.4 at high / medium / low
history = "drop-after-final"    # OpenAI rule: keep CoT inside a tool loop, drop it after a final answer

[context]
working_max = 98304
compact_at = 0.70
max_tokens = 16384              # cuts 1 of 304 M0 steps (17,825 tokens) plus the 32,768-token runaway; M0 step records, runs/20261030T055501Z
ceiling = 131072                # the model card: a context of 128K

[template]
# Vetted copy for the Generic path; the Native path renders prompts itself and ignores it.
dir = "profiles/templates/gpt-oss-20b"
file_sha256 = "a4c9919cbbd4acdd51ccffe22da049264b1b73e59055fa58811a99efbd7c8146"
# sha256 of the served form, as /props reports it (template.rs: served_form)
known = [
    { sha256 = "b2215de6da8ba369957eece8c5aa18f4af94f6c4d311d85e691373a421d80e89", verdict = "canonical", note = "openai/gpt-oss-20b, 2025-08-08" },
    { sha256 = "70da0d2348e40aaf8dad05f04a316835fd10547bd7e3392ce337e4c79ba91c01", verdict = "bad", note = "Unsloth GGUF template: relabels earlier final answers as analysis when reasoning_content is sent back" },
]

[server]
recommended_flags = "-c 131072 -np 2 --kv-unified --swa-full -fa on -ngl 99 -b 2048 -ub 2048 --chat-template-file profiles/templates/gpt-oss-20b/canonical.jinja"
notes = "f16 KV. --swa-full costs about +3 GiB at 128K and makes history rewinds free."
