[package]
name = "ognivo-os"
description = "What differs between Linux and Windows for ognivo: home, private files, programs, Git Bash, process trees, signals, the core's socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "signal", "net", "io-util", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "termios"] }

[target.'cfg(windows)'.dependencies]
# the version process-wrap builds on, for its creation flags
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
