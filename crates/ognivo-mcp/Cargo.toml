[package]
name = "ognivo-mcp"
description = "MCP servers for the ognivo agent: their configs, clients, and the tool gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
reqwest.workspace = true
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
