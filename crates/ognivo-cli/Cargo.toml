[package]
name = "ognivo-cli"
description = "The ognivo command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ognivo"
path = "src/main.rs"

[dependencies]
ognivo-core.workspace = true
ognivo-mcp.workspace = true
ognivo-models.workspace = true
ognivo-os.workspace = true
ognivo-protocol.workspace = true
ognivo-store.workspace = true
ognivo-tools.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync"] }

[dev-dependencies]
base64.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
